<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Stored Files</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
        }

        li {
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <h2>Files stored in MongoDB</h2>
    {% if files %}
    <ul>
        {% for f in files %}
        <li>
            {{ f.filename }} ({{ f.size_mb }}MB)
            &mdash; <a href="{{ url_for('download_file', file_id=f.id) }}">download</a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No files uploaded yet.</p>
    {% endif %}
    <a href="{{ url_for('upload_files') }}">Upload a new file</a>
</body>

</html>
