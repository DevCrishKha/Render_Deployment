<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Permission Required</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f1f3f4;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .card {
    background: white;
    padding: 30px 40px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    text-align: center;
    max-width: 400px;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 12px;
    color: #202124;
  }
  p {
    font-size: 14px;
    color: #5f6368;
    margin-bottom: 24px;
  }
  .btn {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 4px;
    background: #1a73e8;
    color: white;
    text-decoration: none;
    font-weight: 500;
  }
  .btn:hover {
    background: #1669c1;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Login Cancelled</h1>
  <p>You can choose to continue <strong>without providing access</strong> to your Gender and Date of Birth.</p>
  <a class="btn" href="/login">Try Again</a>
</div>

</body>
</html>
